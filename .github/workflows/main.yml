name: Inspect Android ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect ZIP
        run: |
          echo "===== ZIP CONTENTS ====="
          unzip -l SetuSuvidhaKendraAndroid-phone-build.zip

          echo ""
          echo "===== EXTRACTING ====="
          rm -rf project
          mkdir project
          unzip -q SetuSuvidhaKendraAndroid-phone-build.zip -d project

          echo ""
          echo "===== FOLDER STRUCTURE ====="
          find project -print | sort

          echo ""
          echo "===== IMPORTANT ANDROID FILES ====="
          find project -type f \( \
            -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \
          \) -print | sort

          echo ""
          echo "===== INSPECTION FINISHED ====="
